models:
  local_qwen_coder:
    provider: ollama
    model_name: qwen3:8b
    think: false
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    # War 220 – stammte offenbar aus einer Messung ohne CPU-Anteil. Real
    # gemessen 02.09.2026 (10 Aufrufe, 71%/29% GPU/CPU-Split): 148.000-305.000ms,
    # Mittel ~206.000ms. Bei 220 verzerrte der Latenz-Score jede Modellwahl
    # zugunsten von lokal, auch mit prefer_local:false.
    avg_latency_ms: 206000
    max_tokens: 4096
    # 16384 liess auf der 8GB-Polaris-GPU nur 61% der Layer aufs GPU passen,
    # Rest lief auf CPU (ollama ps, 01.09.2026). 8192 passt komplett ins VRAM.
    context_length: 8192
    # Arbeitspferd der Werkzeug-/Teamlaeufe: 101 von 114 erfolgreichen Laeufen
    # der letzten 14 Tage (route_decisions, 02.09.2026). Bleibt dauerhaft im
    # VRAM, sonst kostet jede Anfrage nach 5 Minuten Pause 7,5 s Ladezeit.
    # 4,34 GB von 8 GB.
    keep_alive: -1
    tags: [lokal, privat, schnell, tools, code, test, medien]
    priority: 10

  local_dolphin:
    provider: ollama
    model_name: dolphin3:8b
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    avg_latency_ms: 300
    max_tokens: 2048
    context_length: 8192
    # Standardmodell fuers Gespraech – also genau das, bei dem Tino auf die
    # Antwort wartet. Bleibt wie qwen3 dauerhaft im VRAM. Zwei 8B-Modelle
    # passen zwar nicht zusammen in 8 GB, aber Ollama verdraengt bei Bedarf
    # von selbst; wichtig ist nur, dass keines im Leerlauf rausfaellt.
    keep_alive: -1
    tags: [lokal, privat, unzensiert, allgemein, kreativ]
    priority: 9

