router:
  budget_limit_monthly_usd: 5.0
  prefer_local: true
  local_first: true
  standard_model: local_dolphin
  complexity_threshold_high: 7
  quality_judge_min_complexity: 6
  request_cost_limit_usd: 1.0
  # Eskalationsleiter: jede Stufe ist STÄRKER als die darunter. Jude bleibt so lange
  # wie möglich kostenlos und steigt nur auf, wenn die Antwort fachlich nicht reicht.
  #   frei:      dolphin3/qwen3 (lokal)  ->  Groq llama-70b (frei, größer)
  #   günstig:   DeepSeek chat (nur mit Key)
  #   stark:     gpt-5.6-terra (mittleres Reasoning)  ->  claude-sonnet-5
  #   Top-Tier:  gpt-5.6-sol (hohes Reasoning)        ->  claude-fable-5
  # Nicht in der Leiter: gpt-5.6-luna (leichtgewichtig, schwächer als Groq-70b -> keine
  # echte Eskalationsstufe) und gemini-flash (Key ohne API-Zugriff). Beide bleiben als
  # Definition erhalten und lassen sich jederzeit wieder einhängen.
  fallback_chain:
    - tags:lokal            # dolphin3 (Basis) + qwen3 (Tools/Code) – frei, lokal
    - cloud_groq_llama      # frei, Cloud, 70b – erste echte Verstärkung
    - cloud_deepseek_chat   # günstig & fähig (übersprungen ohne DEEPSEEK_API_KEY)
    - cloud_openai_terra    # mittleres Reasoning – erste bezahlte Stufe
    - cloud_claude_sonnet   # stark
    - cloud_openai_sol      # hohes Reasoning, Top-Tier
    - cloud_claude_fable    # Top-Tier, stärkste/teuerste Stufe
    - cloud_openrouter_dolphin  # unzensierte Cloud-Reserve (nur unzensierter Pfad / mit Key)

providers:
  ollama:
    base_url: http://127.0.0.1:11434
    timeout_seconds: 300
    num_retries: 1
  openai:
    base_url: https://api.openai.com/v1
    timeout_seconds: 60
  anthropic:
    base_url: https://api.anthropic.com/v1
    # 60 s riss bei langen Content-Läufen (Newsletter-Konzept, 4k+ Tokens
    # Ausgabe) mitten in der Generierung ab – gemessen 16.08.
    timeout_seconds: 180
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta
    timeout_seconds: 60
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 90
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    timeout_seconds: 60
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    timeout_seconds: 90