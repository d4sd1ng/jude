router:
  budget_limit_monthly_usd: 20.0
  # War true, als lokal die einzige kostenlose Stufe war. Gemessen 02.09.2026:
  # qwen3:8b passt auf dieser 8GB-Polaris-GPU selbst bei 8192 Kontext nur zu
  # 71% ins VRAM, der Rest laeuft auf CPU – 2,5 bis 5 Minuten JE Schritt. Ein
  # Tagesjob mit 8-17 Schritten brauchte dadurch 15-17 Minuten. Ollama Cloud
  # (cloud_ollama_gptoss) ist GENAUSO kostenlos und braucht dafuer ~600ms.
  # Lokal bleibt als Fallback in der Kette – nur nicht mehr zuerst.
  prefer_local: false
  local_first: false
  standard_model: local_dolphin
  complexity_threshold_high: 7
  request_cost_limit_usd: 1.0
  # Eskalationsleiter: jede Stufe ist STÄRKER als die darunter. Jude bleibt so lange
  # wie möglich kostenlos und steigt nur auf, wenn eine Stufe tatsächlich fehlschlägt
  # (Fehler, gesperrt, ueber dem Kostenlimit) – nicht mehr aufgrund einer nachtraeglichen
  # Guete-Bewertung der Antwort (entfernt 05.09.2026, siehe model_router.py).
  #   frei:      gpt-oss-120b über Ollama Cloud  ->  dolphin3/qwen3 (lokal, Reserve)
  #   günstig:   DeepSeek chat (nur mit Key)
  #   stark:     gpt-5.6-terra (mittleres Reasoning)  ->  claude-sonnet-5
  #   Top-Tier:  gpt-5.6-sol (hohes Reasoning)        ->  claude-fable-5
  # Nicht in der Leiter: gpt-5.6-luna (leichtgewichtig, schwächer als gpt-oss-120b -> keine
  # echte Eskalationsstufe) und gemini-flash (Key ohne API-Zugriff). Beide bleiben als
  # Definition erhalten und lassen sich jederzeit wieder einhängen.
  # Lokal steht jetzt NACH den freien Cloud-Stufen, nicht davor: qwen3:8b passt auf der
  # 8GB-Polaris-GPU nicht vollstaendig ins VRAM (71%/29% GPU/CPU) UND hat sich beim echten
  # Test (content, 02.09.2026) einen Werkzeugaufruf als Fliesstext ausgedacht statt ihn
  # wirklich auszufuehren ("Mike lahmgelegt"-Muster) – kein einziger Direkttest gegen die
  # Cloud-Modelle zeigte dieses Verhalten. Genauso kostenlos, zuverlässiger, schneller.
  fallback_chain:
    - cloud_ollama_gptoss   # frei, Cloud, 120b, werkzeugfähig – erste echte Verstärkung
    - cloud_ollama_nemotron_ultra  # frei, Cloud, weitere werkzeugfähige Stufe vor den bezahlten
    - cloud_ollama_nemotron_super  # frei, Cloud, schneller
    - cloud_ollama_gptoss20        # frei, Cloud, kleiner/schneller
    - cloud_ollama_gemma           # frei, Cloud, letzte kostenlose Cloud-Reserve
    - cloud_deepseek_chat   # günstig & fähig (übersprungen ohne DEEPSEEK_API_KEY)
    - cloud_openai_terra    # mittleres Reasoning – erste bezahlte Stufe
    - cloud_claude_sonnet   # stark
    - cloud_openai_sol      # hohes Reasoning, Top-Tier
    - cloud_claude_fable    # Top-Tier, stärkste/teuerste Stufe
    - cloud_openrouter_dolphin  # unzensierte Cloud-Reserve, 24B (nur unzensierter Pfad / mit Key)
    - cloud_openrouter_hermes   # groessere unzensierte Stufe, 70B
    # War auf Position 6 (VOR fuenf Cloud-Stufen) trotz dieses Kommentars, der
    # das Gegenteil beschreibt. Blockierte damit einen von nur 3 Worker-Slots
    # fuer bis zu 300s (timeout_seconds unten), sobald die kostenlosen
    # Ollama-Cloud-Stufen gesperrt waren – gemessen 03.09.2026 bei redakteur
    # UND content, identischer Stack-Trace, echter Reserve-Charakter jetzt
    # durch die Position ganz am Ende hergestellt.
    - tags:lokal            # dolphin3 + qwen3 – Reserve, falls je alle Cloud-Stufen ausfallen

providers:
  ollama:
    base_url: http://127.0.0.1:11434
    # War 300s: blockierte einen von 3 Scheduler-Worker-Slots bis zu 5 Minuten
    # pro Versuch, wenn die lokale GPU (kein funktionierendes ROCm auf dieser
    # Polaris-Karte) nicht rechtzeitig antwortete – jetzt ohnehin letzte
    # Reserve nach allen Cloud-Stufen, darf kurz sein.
    timeout_seconds: 45
    num_retries: 1
  openai:
    base_url: https://api.openai.com/v1
    timeout_seconds: 60
  anthropic:
    base_url: https://api.anthropic.com/v1
    # 60 s riss bei langen Content-Läufen (Newsletter-Konzept, 4k+ Tokens
    # Ausgabe) mitten in der Generierung ab – gemessen 16.08.
    timeout_seconds: 180
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta
    timeout_seconds: 60
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 90
  # Ollama Cloud. Eigener Provider-Name statt "ollama", obwohl dieselbe
  # Software dahintersteckt: die Anfragen verlassen den Rechner, duerfen also
  # weder als "lokal/privat" gelten noch am Guthaben-Gate vorbei.
  ollama_cloud:
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
    timeout_seconds: 180
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    timeout_seconds: 90